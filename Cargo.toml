[package]
name = "bioscape"
version = "0.0.1"
edition = "2021"
description = "TBD"
license = "MIT OR Apache-2.0"

[lib]
name = "bioscape"
path = "src/lib.rs"

[[bin]]
name = "bioscape"
path = "src/main.rs"

# Trimmed Bevy feature set: skips `bevy_gilrs` (libudev) and `audio` (alsa)
# so we don't need system packages for an evolution sim that uses neither.
[dependencies]
bevy = { version = "0.18", default-features = false, features = [
    # `default_app` minus nothing
    "async_executor",
    "bevy_asset",
    "bevy_input_focus",
    "bevy_log",
    "bevy_state",
    "bevy_window",
    "custom_cursor",
    "reflect_auto_register",
    # `default_platform` minus `bevy_gilrs` and `webgl2` (we're native, not WASM)
    "std",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "x11",
    "wayland",
    "sysinfo_plugin",
    # 2D + 3D rendering stack (sprites, PBR, core pipeline, gizmos, post-process)
    "2d_bevy_render",
    "3d_bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    # Sprint 88: post_process pro Bloom (atmospheric pass).
    "bevy_post_process",
    # Sprint 69: gizmo lines pro bond visualization (debug-line drawing
    # napřímo z systému přes `Gizmos` system param). Oba feature flagy
    # potřeba — `bevy_gizmos` je data+systems, `bevy_gizmos_render` je actual
    # rendering pipeline (bez něj se line resources sbírají, ale nikdy
    # nedostanou na obrazovku).
    "bevy_gizmos",
    "bevy_gizmos_render",
    # UI overlays (Node + Text); bevy_text comes in transitively via 2d_bevy_render
    "bevy_ui",
    "bevy_ui_render",
    # Texture decoding for whenever we add textured cells
    "png",
    "tonemapping_luts",
    # `tonemapping_luts` pulls in zstd; pick the pure-Rust backend.
    "zstd_rust",
] }
rand = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
# Sprint 57: SpatialGrid bucket map. SipHash randomizes per-process seed, FxHash
# is fixed-seed + 5-10× faster — hot path does 27-243 lookups per radius query.
rustc-hash = "2"
# Sprint 112: portable SIMD wrapper pro brain forward pass — `f32x8` mapuje
# na AVX2 lanes (target-cpu=native ze Sprintu 111 zapíná FMA → mul_add se
# slije do jedné instrukce). 8 lanes × ~10 chunks per row pokrývá padded
# BRAIN_INPUTS=80 a padded BRAIN_HIDDEN=56.
wide = "1"
# Wave N: GPU compute is mandatory — wgpu / bytemuck / pollster no longer
# gated by the `gpu` feature flag (removed).
wgpu = "23"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[features]
# Speeds up incremental rebuilds during development.
# Run with: cargo run --features dev
dev = ["bevy/dynamic_linking"]

[dev-dependencies]
indicatif = "0.18"
textplots = "0.8"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "headless_phases"
harness = false

[[bench]]
name = "full_tick"
harness = false

[[bench]]
name = "predate_gpu"
harness = false

# Bevy recommended dev profile: fast compile for our code, optimized deps for runtime.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Sprint 57: aggressive release tuning. LTO + single codegen unit eats 2-3× more
# build time but inlines across crate boundaries (Bevy, wgpu, rayon) and lets
# LLVM see the whole program for vectorization.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

# Profile pro `cargo flamegraph` / perf — `thin` LTO + 16 codegen units zkrátí
# build z ~10 min na ~2 min, debug-info zachová symboly a callstacky se rozliší
# i bez DWARF unwinding (force-frame-pointers v RUSTFLAGS, viz scripts/profile.sh).
[profile.release-debug]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = true
